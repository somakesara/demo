<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GCC Hyderabad Pulse · Issue 01 · June 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root {
    --brand-primary: #3B2FC9;
    --brand-dark:    #1E1A6E;
    --brand-light:   #EEEDFE;
    --brand-accent:  #5DCAA5;
    --text-primary:  #111110;
    --text-muted:    #6B6A65;
    --border:        rgba(0,0,0,0.10);
    --bg-page:       #F5F4F0;
    --bg-card:       #FFFFFF;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-page);
    color: var(--text-primary);
    font-size: 14px;
    line-height: 1.6;
    padding: 2rem 1rem;
  }

  .nl {
    max-width: 680px;
    margin: 0 auto;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  /* HEADER */
  .nl-header {
    background: var(--brand-dark);
    padding: 2rem 2.5rem 1.75rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 1rem;
  }
  .nl-wordmark {
    font-family: 'DM Serif Display', serif;
    font-size: 26px;
    color: #fff;
    letter-spacing: -0.3px;
    line-height: 1.1;
  }
  .nl-sub {
    font-size: 12px;
    color: rgba(255,255,255,0.55);
    margin-top: 5px;
    letter-spacing: 0.04em;
  }
  .nl-edition { text-align: right; }
  .nl-issue {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--brand-accent);
  }
  .nl-date {
    font-size: 12px;
    color: rgba(255,255,255,0.45);
    margin-top: 4px;
  }

  /* BODY */
  .nl-body { padding: 0; }

  .nl-body-inner { padding: 2rem 2.5rem; }
  .s-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--brand-primary);
    margin-bottom: 12px;
  }

  /* HERO — full bleed, tall */
  .hero {
    background: var(--brand-dark);
    padding: 3.5rem 2.5rem 3rem;
    margin-bottom: 0;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 280px; height: 280px;
    border-radius: 50%;
    background: rgba(255,255,255,0.035);
  }
  .hero::after {
    content: '';
    position: absolute;
    bottom: -80px; left: 40%;
    width: 220px; height: 220px;
    border-radius: 50%;
    background: rgba(91,202,165,0.07);
  }
  .hero-eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--brand-accent);
    margin-bottom: 16px;
  }
  .hero-headline {
    font-family: 'DM Serif Display', serif;
    font-size: 40px;
    color: #ffffff;
    line-height: 1.18;
    margin-bottom: 18px;
    max-width: 540px;
  }
  .hero-body {
    font-size: 15px;
    color: rgba(255,255,255,0.62);
    line-height: 1.75;
    max-width: 500px;
  }
  .hero-stat-row {
    display: flex;
    gap: 2.5rem;
    margin-top: 2.25rem;
    padding-top: 2rem;
    border-top: 1px solid rgba(255,255,255,0.12);
  }
  .hero-stat-value {
    font-size: 26px;
    font-weight: 600;
    color: #fff;
    line-height: 1;
  }
  .hero-stat-label {
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    margin-top: 5px;
  }

  /* METRICS */
  .metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 2rem;
  }
  .metric {
    background: var(--bg-page);
    border-radius: 8px;
    padding: 1rem 1.1rem;
  }
  .metric-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .metric-value { font-size: 26px; font-weight: 600; color: var(--text-primary); line-height: 1.1; }
  .metric-delta { font-size: 11px; color: #0F6E56; margin-top: 4px; }
  .metric-delta.down { color: #993C1D; }
  .metric-delta.neutral { color: var(--text-muted); }

  hr { border: none; border-top: 1px solid var(--border); margin: 1.75rem 0; }

  /* UPDATE CARDS */
  .updates {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 2rem;
  }
  .update-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.1rem;
  }
  .update-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 20px;
    margin-bottom: 8px;
  }
  .update-title { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
  .update-body { font-size: 12px; color: var(--text-muted); line-height: 1.55; }

  /* TWO COL */
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
    margin-bottom: 2rem;
    align-items: start;
  }

  /* SPOTLIGHT */
  .spotlight { display: flex; gap: 12px; align-items: flex-start; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--brand-light); color: var(--brand-primary);
    font-size: 13px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .spotlight-name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
  .spotlight-role { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .spotlight-quote { font-size: 12px; color: var(--text-muted); font-style: italic; margin-top: 8px; line-height: 1.6; }

  /* UPCOMING */
  .upcoming-list { list-style: none; }
  .upcoming-list li {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12px;
  }
  .upcoming-list li:last-child { border-bottom: none; }
  .date-badge {
    font-size: 10px; font-weight: 600;
    background: var(--brand-light); color: var(--brand-primary);
    padding: 2px 7px; border-radius: 4px; white-space: nowrap; flex-shrink: 0; margin-top: 1px;
  }
  .upcoming-text { color: var(--text-muted); }
  .upcoming-text strong { color: var(--text-primary); font-weight: 500; }

  /* FOOTER */
  .nl-footer {
    background: var(--bg-page); border-top: 1px solid var(--border);
    padding: 1.25rem 2.5rem;
    display: flex; justify-content: space-between; align-items: center;
  }
  .footer-brand { font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.04em; }
  .footer-next { font-size: 11px; color: var(--text-muted); }

  @media (max-width: 520px) {
    .nl-header    { flex-direction: column; align-items: flex-start; padding: 1.5rem; }
    .nl-edition   { text-align: left; }
    .hero         { padding: 2rem 1.5rem 2rem; }
    .hero-headline { font-size: 28px; }
    .hero-stat-row { gap: 1.5rem; flex-wrap: wrap; }
    .nl-body-inner { padding: 1.5rem; }
    .metrics      { grid-template-columns: 1fr 1fr; }
    .updates      { grid-template-columns: 1fr; }
    .two-col      { grid-template-columns: 1fr; gap: 1.5rem; }
    .nl-footer    { flex-direction: column; gap: 6px; align-items: flex-start; padding: 1rem 1.5rem; }
  }
</style>
</head>
<body>
<article class="nl">

  <header class="nl-header">
    <div>
      <div class="nl-wordmark">GCC Hyderabad Pulse</div>
      <div class="nl-sub">Monthly Update · Engineering &amp; Operations</div>
    </div>
    <div class="nl-edition">
      <div class="nl-issue" id="hdr-issue"></div>
      <div class="nl-date" id="hdr-date"></div>
    </div>
  </header>

  <div class="nl-body">

    <!-- HERO — full bleed, no inner padding -->
    <div class="hero">
      <div class="hero-eyebrow" id="hero-eyebrow"></div>
      <div class="hero-headline" id="hero-headline"></div>
      <p class="hero-body" id="hero-body"></p>
      <div class="hero-stat-row" id="hero-stats"></div>
    </div>

    <div class="nl-body-inner">

    <!-- METRICS -->
    <div class="s-label">At a glance</div>
    <div class="metrics" id="metrics-grid"></div>

    <hr>

    <!-- UPDATES -->
    <div class="s-label">Updates by stream</div>
    <div class="updates" id="updates-grid"></div>

    <hr>

    <div class="two-col">
      <div>
        <div class="s-label">Team spotlight</div>
        <div class="spotlight">
          <div class="avatar" id="spotlight-initials"></div>
          <div>
            <div class="spotlight-name" id="spotlight-name"></div>
            <div class="spotlight-role" id="spotlight-role"></div>
            <p class="spotlight-quote" id="spotlight-quote"></p>
          </div>
        </div>
      </div>
      <div>
        <div class="s-label">Coming up</div>
        <ul class="upcoming-list" id="upcoming-list"></ul>
      </div>
    </div>

    </div><!-- end .nl-body-inner -->
  </div><!-- end .nl-body -->

  <footer class="nl-footer">
    <span class="footer-brand" id="footer-brand"></span>
    <span class="footer-next" id="footer-next"></span>
  </footer>

</article>

<script>
/* ════════════════════════════════════════════════════════
   NEWSLETTER DATA — Edit this object each month.
   All sections render from here. Nothing else to change.
   ════════════════════════════════════════════════════════ */
const DATA = {

  meta: {
    issue:    "Issue 01",
    date:     "June 2026 · Hyderabad, India",
    brand:    "GCC Hyderabad · Monthly Pulse",
    nextDate: "July 31, 2026"
  },

  hero: {
    eyebrowLabel: "This month's highlight",
    eyebrow:      "Month 01 · June 2026",
    headline:     "Center is live — 42 members onboarded in Month 1",
    body:         "Infrastructure is stable, hiring is ahead of plan, and the first two product squads begin sprint cycles next week. Strong foundation for Q3 goals.",
    /* Max 3 quick stats shown inside the hero */
    stats: [
      { value: "42",  label: "Team members" },
      { value: "Day 8", label: "CI/CD went live" },
      { value: "Q3",  label: "OKRs locked" }
    ]
  },

  /* ── AT A GLANCE ──────────────────────────────────────
     direction: "up" | "down" | "neutral"               */
  metrics: [
    { label: "Team headcount", value: "42",    delta: "↑ 12 this month",    direction: "up"      },
    { label: "Open roles",     value: "18",    delta: "5 offers pending",    direction: "neutral" },
    { label: "Infra uptime",   value: "99.8%", delta: "Above 99.5% target", direction: "up"      }
  ],

  /* ── UPDATES BY STREAM ────────────────────────────────
     Add, remove or reorder cards freely.
     tagColor / tagText: any valid CSS color or hex.     */
  updates: [
    {
      tag: "Engineering",
      tagColor: "#E6F1FB", tagText: "#0C447C",
      title: "Dev environments provisioned",
      body:  "All 3 squads have full toolchain access. CI/CD pipeline went live on Day 8."
    },
    {
      tag: "Operations",
      tagColor: "#EAF3DE", tagText: "#27500A",
      title: "Office space secured",
      body:  "Jubilee Hills facility signed. Capacity: 120 seats. Move-in August 1."
    },
    {
      tag: "People",
      tagColor: "#FAEEDA", tagText: "#633806",
      title: "Hiring pipeline strong",
      body:  "240 screened, 32 final rounds, 5 offers out. Senior SRE search begins July."
    },
    {
      tag: "Leadership",
      tagColor: "#FAECE7", tagText: "#712B13",
      title: "HQ alignment complete",
      body:  "OKRs locked with global team. GCC goals tied to 3 company-level key results."
    }
  ],

  spotlight: {
    initials: "PR",
    name:     "Priya Rajan",
    role:     "Staff Engineer, Platform",
    quote:    '"Set up the internal developer portal from scratch in 10 days — already saving 4 hours/week per engineer."'
  },

  upcoming: [
    { date: "Jul 3",  title: "Q3 kickoff",        detail: "all-hands with HQ"   },
    { date: "Jul 10", title: "Hiring day",         detail: "campus drive, IIIT-H" },
    { date: "Jul 22", title: "First sprint demo",  detail: "squads 1 & 2"        },
    { date: "Aug 1",  title: "Office move-in",     detail: "Jubilee Hills"        }
  ]

};
/* ════════════════════════════════════════════════════════
   RENDERER — no edits needed below this line
   ════════════════════════════════════════════════════════ */
function render() {
  const { meta, hero, metrics, updates, spotlight, upcoming } = DATA;

  /* header */
  document.getElementById('hdr-issue').textContent = meta.issue;
  document.getElementById('hdr-date').textContent  = meta.date;

  /* hero */
  document.getElementById('hero-eyebrow').textContent  = hero.eyebrow;
  document.getElementById('hero-headline').textContent      = hero.headline;
  document.getElementById('hero-body').textContent          = hero.body;
  document.getElementById('hero-stats').innerHTML = hero.stats.map(s =>
    `<div>
      <div class="hero-stat-value">${s.value}</div>
      <div class="hero-stat-label">${s.label}</div>
    </div>`
  ).join('');

  /* metrics */
  document.getElementById('metrics-grid').innerHTML = metrics.map(m =>
    `<div class="metric">
      <div class="metric-label">${m.label}</div>
      <div class="metric-value">${m.value}</div>
      <div class="metric-delta ${m.direction === 'down' ? 'down' : m.direction === 'neutral' ? 'neutral' : ''}">${m.delta}</div>
    </div>`
  ).join('');

  /* updates */
  document.getElementById('updates-grid').innerHTML = updates.map(u =>
    `<div class="update-card">
      <span class="update-tag" style="background:${u.tagColor};color:${u.tagText}">${u.tag}</span>
      <div class="update-title">${u.title}</div>
      <p class="update-body">${u.body}</p>
    </div>`
  ).join('');

  /* spotlight */
  document.getElementById('spotlight-initials').textContent = spotlight.initials;
  document.getElementById('spotlight-name').textContent     = spotlight.name;
  document.getElementById('spotlight-role').textContent     = spotlight.role;
  document.getElementById('spotlight-quote').textContent    = spotlight.quote;

  /* upcoming */
  document.getElementById('upcoming-list').innerHTML = upcoming.map(e =>
    `<li>
      <span class="date-badge">${e.date}</span>
      <span class="upcoming-text"><strong>${e.title}</strong> — ${e.detail}</span>
    </li>`
  ).join('');

  /* footer */
  document.getElementById('footer-brand').textContent = meta.brand;
  document.getElementById('footer-next').textContent  = `Next issue → ${meta.nextDate}`;
}

render();
</script>
</body>
</html>
